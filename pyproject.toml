[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proj_tiku_v1_goal"
version = "0.1.0"
description = "PDF 题库自动提取系统 - GM2"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Yunduowenhua Developer Team" }
]
dependencies = [
    "PySide6>=6.5.0",
    "PyMuPDF>=1.22.0",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python>=4.8.0",
    "Pillow>=9.5.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
